<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom</title>
</head>
<body>
    <div id="student1"></div>
    <div id="student2"></div>
    <div id="student3"></div>
    <script>
        // student 1
        let s1 = document.getElementById("student1")
        
        let student1 = {
            name: "Femi samson", age: 24, course: "material science", class: "300L",subject:"Maths", total:""
        }
        let s1name= document.createElement("p")
        s1name.textContent = student1.name
        s1.appendChild(s1name)

        let s1age= document.createElement("p")
        s1age.textContent = student1.age
        s1.appendChild(s1age)
        // s1age.style.fontSize="30px"
        // s1age.style.color="red"

        let s1course= document.createElement("p")
        s1course.textContent = student1.course
        s1.appendChild(s1course)

        let s1class= document.createElement("p")
        s1class.textContent = student1.class
        s1.appendChild(s1class)


        let s1subject= document.createElement("p")
        s1subject.textContent = student1.subject
        s1.appendChild(s1subject)

        let s1total= document.createElement("p")
        s1total.textContent = student1.age +10
        s1.appendChild(s1total) 
        s1total.style.color="blue"
